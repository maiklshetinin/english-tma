name: Deploy to GitHub Pages
on: { push: { branches: [main] } }
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
        env:
          # Settings → Secrets and variables → Actions → Variables (это не секреты: всё попадает в публичный JS)
          VITE_API_URL: ${{ vars.API_URL }}                           # https://ваш-сервис.onrender.com
          VITE_BOT_USERNAME: ${{ vars.BOT_USERNAME }}                 # без @, для кнопки входа в браузере
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}         # web-конфиг: Firebase → Project settings → Your apps
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
